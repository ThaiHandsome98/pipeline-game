<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fix the Pipeline - Nối Ống DevOps</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/index-fTMvm-Cx.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🔧 Fix the Pipeline</h1>
      <p class="subtitle">Xoay ống để nối <strong>Start → End</strong> trước khi thanh tải đầy.</p>
    </header>

    <!-- Mission banner + Session info -->
    <div id="mission-banner" class="mission-banner">
      <div class="mission-icon" id="mission-icon">🚀</div>
      <div class="mission-info">
        <div class="mission-label">MISSION</div>
        <div class="mission-title" id="mission-title">Git Push → Production</div>
      </div>
      <div class="session-info">
        <div class="session-level">Level <span id="level-num">1</span></div>
        <div class="session-streak" id="session-streak">Session mới</div>
      </div>
    </div>

    <div class="status-bar">
      <div class="load-label">
        <span id="load-name">CPU Load</span>
        <span id="load-percent">0%</span>
      </div>
      <div class="progress-track">
        <div id="progress-bar" class="progress-fill"></div>
      </div>
    </div>

    <div class="game-area" id="game-area">
      <div id="board" class="board"></div>
    </div>

    <div class="controls">
      <div id="message" class="message"></div>
      <button id="btn-new" class="btn-link">↻ New Session</button>
    </div>
  </div>

  <script src="./assets/index-Cyaqnujh.js"></script>
</body>
</html>
